sources:
  - name: erp
    description: Sistema ERP da Banvic com dados de clientes, colaboradores, contas e transações.
    schema: erp_banvic
    tables:
      - name: localidades
        description: Tabela fonte de localidades com informação de cidade e estado
        columns:
          - name: cod_localidade
            description: Chave primaria tabela localidades
            data_tests:
              - unique
              - not_null

      - name: clientes
        description: Tabela fonte de clientes
        columns:
          - name: cod_cliente
            description: Chave primaria tabela clientes
            data_tests:
              - unique
              - not_null

      - name: colaboradores
        description: Tabela fonte de colaboradores
        columns:
          - name: cod_colaborador
            description: Chave primaria tabela colaboradores
            data_tests:
              - unique
              - not_null

      - name: agencias
        description: Tabela fonte de agências
        columns:
          - name: cod_agencia
            description: Chave primaria tabela agencias
            data_tests:
              - unique
              - not_null

      - name: colaborador_agencia
        description: Tabela fonte da relação colaborador x agência
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - cod_colaborador
                  - cod_agencia

      - name: contas
        description: Tabela fonte de contas
        columns:
          - name: num_conta
            description: Chave primaria tabela contas
            data_tests:
              - unique
              - not_null

      - name: transacoes
        description: Tabela fonte de transações
        columns:
          - name: cod_transacao
            description: Chave primaria tabela transacoes
            data_tests:
              - unique
              - not_null

      - name: propostas_credito
        description: Tabela fonte de propostas de crédito
        columns:
          - name: cod_proposta
            description: Chave primaria tabela propostas_credito
            data_tests:
              - unique
              - not_null